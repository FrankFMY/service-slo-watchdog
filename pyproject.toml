[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "service-slo-watchdog"
version = "0.1.0"
description = "Bounded external SLO probes with deduplicated alert and recovery state."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Artem Prianishnikov", email = "Pryanishnikovartem@gmail.com" }
]
keywords = ["slo", "watchdog", "monitoring", "health-check", "prometheus"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/FrankFMY/service-slo-watchdog"
Repository = "https://github.com/FrankFMY/service-slo-watchdog"
Issues = "https://github.com/FrankFMY/service-slo-watchdog/issues"

[project.scripts]
service-slo-watchdog = "service_slo_watchdog.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/service_slo_watchdog"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
