name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --editable . ruff build twine
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Verify the built wheel in an isolated environment
        shell: bash
        run: |
          python -m venv /tmp/watchdog-wheel
          /tmp/watchdog-wheel/bin/pip install --no-deps dist/*.whl
          /tmp/watchdog-wheel/bin/service-slo-watchdog --help >/dev/null
